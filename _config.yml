# Jekyll configuration for the maschinenlesbar.org organisation site.
# GitHub Pages builds this automatically on every push to the default branch
# (Settings -> Pages -> Source -> "Deploy from a branch"). Write Markdown; the
# theme below turns it into HTML. No GitHub Actions workflow required.

title: maschinenlesbar.org
description: TypeScript API clients & command-line tools for German open-government APIs

# A GitHub Pages supported theme — a clean single-column landing layout.
theme: jekyll-theme-cayman

# Cayman shows a "View on GitHub" button when this is set.
github:
  is_project_page: false

# Don't process these when building the site.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
