name: Pages

# Builds the maschinenlesbar.org landing page from site/ with Jekyll and deploys it
# to GitHub Pages at the organisation root (https://maschinenlesbar-org.github.io/).
# The banira components are smoke-tested, linted and compiled, Fylgja's stylesheets
# are vendored from npm, and the tool catalogue is generated from the plugin
# marketplace and every CLI repository (see site/_plugins/catalog.rb). That content
# lives in other repositories, so the site also rebuilds weekly. Nothing is
# committed: the site is assembled here and published as a Pages artifact.
#
# One-time repo setting: Settings -> Pages -> Build and deployment -> Source ->
# "GitHub Actions".
on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  # Pick up new tools, versions and skills from the other repositories.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

# Least privilege at the workflow level: only read. The Pages/OIDC write scopes
# are granted per-job, to the deploy job that actually needs them.
permissions:
  contents: read

# Allow one in-flight Pages deployment at a time; don't cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.x
          # No dependency caches in a job whose output gets deployed.
          package-manager-cache: false

      - name: Use Ruby 3.4
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'
          working-directory: site
          bundler-cache: false

      - name: Install
        run: |
          npm ci
          bundle install

      - name: Test components (banira test + lint)
        run: npm test

      - name: Build assets (Fylgja CSS, banira components)
        run: npm run build:assets

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # Scopes the Pages deploy needs, granted only to this job.
    permissions:
      pages: write # publish the uploaded artifact as the Pages site
      id-token: write # OIDC token deploy-pages exchanges for the Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
