<!doctype html>
<!--
  The source of the link-preview images (Open Graph / Twitter card), 1200×630, and of the
  touch icon. Not part of the site (scripts/ is excluded). Regenerate after a change with
  headless Chrome, from site/:

    CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
    for lang in en de; do
      "$CHROME" --headless=new --hide-scrollbars --window-size=1200,630 \
        --screenshot=assets/img/social-$lang.png "file://$PWD/scripts/social-image.html#$lang"
    done
    "$CHROME" --headless=new --hide-scrollbars --window-size=180,180 \
      --screenshot=apple-touch-icon.png "file://$PWD/scripts/social-image.html#icon"
-->
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box; padding: 80px 88px;
    display: flex; flex-direction: column; justify-content: space-between;
    background: #0b2a3d; color: #fff;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  .mark {
    width: 112px; height: 112px; border-radius: 24px; background: #0b5e8e;
    display: grid; place-items: center;
    font: 700 52px/1 ui-monospace, Menlo, monospace;
  }
  h1 { margin: 0; font-size: 76px; letter-spacing: -0.02em; }
  h1 span { color: #7cc4ec; font-weight: 500; }
  p { margin: 20px 0 0; font-size: 38px; line-height: 1.3; color: #cfe6f3; max-width: 960px; }
  body.icon { width: 180px; height: 180px; padding: 0; background: #0b5e8e; display: grid; place-items: center; }
  body.icon > * { display: none; }
  body.icon .mark { display: grid; width: 180px; height: 180px; border-radius: 0; font-size: 84px; }
</style>
<body>
  <div class="mark">&gt;_</div>
  <div>
    <h1>maschinenlesbar<span>.org</span></h1>
    <p id="tagline"></p>
  </div>
</body>
<script>
  const taglines = {
    en: 'German public-sector information, searchable and machine-readable.',
    de: 'Staat und Verwaltung, durchsuchbar und maschinenlesbar.',
  };
  const key = location.hash.slice(1) || 'en';
  if (key === 'icon') document.body.className = 'icon';
  else document.getElementById('tagline').textContent = taglines[key];
</script>
