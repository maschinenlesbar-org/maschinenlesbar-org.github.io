name: Deutsch

site:
  title: maschinenlesbar.org
  description: >-
    Ein Suchindex über 12.000 Quellen aus Staat und Verwaltung und quelloffene Wrapper um
    die amtlichen APIs: im Web, auf der Kommandozeile und über MCP.
  home_title: "maschinenlesbar.org: Staat und Verwaltung, durchsuchbar und maschinenlesbar"
  locale: de_DE
  image: /assets/img/social-de.png
  image_alt: "maschinenlesbar.org: Staat und Verwaltung, durchsuchbar und maschinenlesbar."

nav:
  label: Hauptnavigation
  github: GitHub
  language: Sprache
  skip: Zum Inhalt springen

status:
  available: Verfügbar
  making: In Arbeit

hero:
  eyebrow: Offene Daten, maschinenlesbar
  title: Staat und Verwaltung, lesbar für Menschen und Agenten
  intro: >-
    Seit 2012 auf dem Weg zu einer maschinenlesbaren Verwaltung.
  lead: >-
    Ein Suchindex über rund 12.000 öffentliche Quellen, vom Bundestag bis zur einzelnen
    Gemeinde, und Wrapper um die amtlichen APIs von Bund, Ländern und Behörden. Der Index
    findet die Quelle, der Wrapper holt ihre aktuellen Daten – strukturiert.

halves:
  title: Zwei Hälften, ein System
  search_question: Wo steht das?
  search_title: Suchindex
  search_text: >-
    Volltext- und semantische Suche im öffentlichen deutschen Web, vom Bund bis zur
    Kommune. Jeder Treffer sagt, woher er stammt.
  wrappers_question: Was sagt die Quelle gerade?
  cli_title: schland cli
  cli_text: >-
    Die API-Wrapper auf der Kommandozeile: ein Tool pro amtlicher API, für Menschen und
    Skripte.
  mcp_title: schland mcp
  mcp_text: >-
    Die Wrapper als MCP-Server, für Agenten: Tools für die Fragen, die ein Agent stellt, auf
    demselben Client wie die CLI.
  handoff: >-
    Entscheidend ist die Übergabe. Der Index findet eine Quelle, der passende Wrapper holt
    ihre aktuellen Daten. Verweist die Antwort eines Wrappers auf ein Dokument, liefert der
    Index es vollständig.
  more: Wie alles zusammenspielt

surfaces:
  title: Für Menschen und für Agenten
  web_title: Im Browser
  web_text: >-
    Den Bestand im Web durchsuchen und jedes Dokument mit seiner Herkunft lesen.
  cli_title: Auf der Kommandozeile
  cli_text: >-
    Ein Kommandozeilen-Tool pro API, auf npm, dazu Skills, mit denen Claude Code es
    bedienen kann.
  mcp_title: Für Agenten, über MCP
  mcp_text: >-
    Ein MCP-Server pro API, auf npm und als Container-Image, zum Selbstbetrieb. Als
    Nächstes folgen das Such-Tool und gehostete Server: finden und abrufen über einen
    Endpunkt.

